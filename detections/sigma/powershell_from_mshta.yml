
title: PowerShell Spawned by MSHTA
id: 4c7d2b81-9a63-4f5e-8b21-7a2c6d9e1043
status: experimental
description: Detects PowerShell launched by mshta.exe, which may indicate suspicious script execution.
author: Threat Detection & Threat Hunting Lab
date: 2026-10-09
logsource:
    product: windows
    category: process_creation
detection:
    selection:
        ParentImage|endswith: '\mshta.exe'
        Image|endswith: '\powershell.exe'
    condition: selection
falsepositives:
    - Legitimate administrative scripts
    - Authorized security testing
level: medium
tags:
    - attack.execution
    - attack.t1059.001
    - attack.t1218.005
